[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-extremities-preprocessor"
version = "0.3.0"
description = "Preprocess extremity X-ray DICOMs (hands/feet): derive body part, side and view from the headers, standardize photometry and orientation, split bilateral images, pair PA with oblique."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pydicom>=2.4",
  "numpy>=1.21",
  "pandas>=1.3",
  "pyyaml>=6.0",
  "SimpleITK>=2.3",
]

[project.optional-dependencies]
# only for visualize.py -- the preprocessing itself needs no matplotlib
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5", "pre-commit>=3.5", "nbstripout>=0.9.1"]

[project.scripts]
dicom-extremities-preprocessor = "dicom_extremities_preprocessor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dicom_extremities_preprocessor*"]

[tool.setuptools.package-data]
dicom_extremities_preprocessor = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the package writes "dp"/"oblique" into ViewPosition, a DICOM CS field with
# standardised values -- pydicom says so once per written file
filterwarnings = ["ignore:Invalid value for VR:UserWarning"]
